# auto-pwa plugin overlay — mount the auto_pwa_* tools into any DSH profile.
#
# Usage (this GUI):
#   pnpm dsh web --patch /home/whitewash/pkgs/auto-pwa/patch/auto-pwa.cordis.yml
#
# Usage (headless):
#   pnpm dsh --profile headless --patch /home/whitewash/pkgs/auto-pwa/patch/auto-pwa.cordis.yml "完成此文件夹分波"
#
# Composition（注意：pwa-fit.ts 是服务定义库，由 pwa-fit-local 导入并注册
# ctx.pwaFit，不作为插件挂载——挂载它会被 loader 当类插件实例化导致
# "service pwaFit has been registered" 重复注册）：
#   pwa-fit-local   Provider：拟合 -> ctx.jobs（JobKind 'ctpwa'，owner 围栏、
#                   完成通知自动唤醒下一轮、统一 job_output/job_kill）
#   pwa-guard       config.yml 写文件单调 deny 门禁（无人硬规则）
#   pwa-commands    /pwa-status 用户旁路观察
#   auto-pwa        Consumer：14 个 auto_pwa_* 工具（run_fit/fit_status 走 ctx.pwaFit）
#
# 依赖 DSH base bundle 自带服务：jobs（dsh-jobs-local）、tools、commands、
# spillStore（spill-local）。
# 插件文件必须是绝对路径（loader 从 profile 目录解析，相对路径找不到）。
- insert:
    - id: pwa-fit-local
      name: '/home/whitewash/pkgs/auto-pwa/plugin/pwa-fit-local.ts'
    - id: pwa-guard
      name: '/home/whitewash/pkgs/auto-pwa/plugin/pwa-guard.ts'
    - id: pwa-commands
      name: '/home/whitewash/pkgs/auto-pwa/plugin/pwa-commands.ts'
    - id: auto-pwa
      name: '/home/whitewash/pkgs/auto-pwa/plugin/auto-pwa.ts'
