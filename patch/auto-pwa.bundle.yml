# auto-pwa npm bundle layer — installable via the profile bundles list.
#
# Install (web profile):
#   pnpm dsh plugin --profile web add auto-pwa
#   # + add "auto-pwa" to the profile's dsh.profile.bundles list
#
# Bundle patches are applied over the profile root config, so the Loader
# resolves entry names from the PROFILE directory (the loader baseUrl), not
# from this file or the package root. Plugins are therefore referenced as bare
# subpath specifiers ("auto-pwa/plugin/<name>"), resolved through the package
# exports map to the compiled lib/plugin/<name>.js — the same convention the
# in-box bundles use. The dev overlay (patch/auto-pwa.cordis.yml) keeps
# absolute source-dir paths instead, so iterative development runs the TS.
#
# 注意：pwa-fit.ts 是服务定义库（由 pwa-fit-local 导入并注册 ctx.pwaFit），
# 不作为插件挂载——挂载它会被 loader 当类插件实例化导致重复注册。
- insert:
    - id: pwa-fit-local
      name: 'auto-pwa/plugin/pwa-fit-local'
    - id: pwa-guard
      name: 'auto-pwa/plugin/pwa-guard'
    - id: pwa-commands
      name: 'auto-pwa/plugin/pwa-commands'
    - id: auto-pwa
      name: 'auto-pwa/plugin/auto-pwa'
